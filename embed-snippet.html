<!-- Lead Funnel Lab embed. Paste into an HTML / embed / code block on your site. -->
<div class="lead-funnel-lab-embed" style="max-width:1240px;margin:0 auto;">
  <iframe
    src="https://marketingopswithsam.github.io/lead-funnel-lab/?embed=1"
    title="Lead Funnel Lab: who should sales call?"
    loading="lazy"
    style="width:100%;height:1400px;border:0;display:block;"
    allow="clipboard-write"></iframe>
</div>
<script>
  // Grows the frame to fit the lab, so there is no scrollbar inside the page.
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://marketingopswithsam.github.io') return;
    if (!e.data || e.data.type !== 'lead-funnel-lab:height') return;
    document.querySelectorAll('.lead-funnel-lab-embed iframe').forEach(function (f) {
      if (f.contentWindow === e.source) f.style.height = e.data.height + 'px';
    });
  });
</script>
